<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ 詞語勇者：打怪物大冒險 (iPad 橫屏響應版)</title>
  <!-- 💡 拼音庫 + 🎉 煙花粒子動畫庫 -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    
    /* 🏰 暗黑魔法城堡背景 */
    body {
      background: radial-gradient(circle at center, #2e1065 0%, #0d061a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 15px;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 🛡️ 玻璃霓虹冒險卡片 (預設豎屏樣式) */
    .card-container {
      background: rgba(26, 16, 51, 0.9);
      border: 3px solid #a855f7;
      backdrop-filter: blur(16px);
      width: 95%;
      max-width: 580px;
      padding: 26px 22px;
      border-radius: 28px;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.3), inset 0 0 15px rgba(168, 85, 247, 0.15);
      text-align: center;
      position: relative;
      transition: all 0.3s ease;
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }
    .count-badge {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }
    .combo-badge {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #ffffff;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
    .high-score-badge {
      background: #eab308;
      color: #3e2723;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
    }
    .mode-badge {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 13px;
      margin-bottom: 12px;
      display: inline-block;
      cursor: pointer;
      border: 1px solid #a855f7;
      transition: all 0.2s ease;
    }
    .mode-badge:hover {
      background: #a855f7;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
    }

    /* 👾 怪物 stage 與血量條 */
    .monster-stage {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .monster-name {
      font-size: 18px;
      font-weight: bold;
      color: #f43f5e;
      margin-bottom: 6px;
    }
    .monster-hp-bar {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      height: 16px;
      width: 100%;
      overflow: hidden;
      border: 1px solid #f43f5e;
    }
    .monster-hp-fill {
      background: linear-gradient(90deg, #ef4444, #10b981);
      height: 100%;
      width: 100%;
      transition: width 0.2s ease;
    }

    /* 卡片與文字 */
    .flashcard {
      background: rgba(15, 10, 30, 0.8);
      border: 3px solid #8b5cf6;
      border-radius: 22px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0 18px 0;
      position: relative;
      transition: all 0.15s ease;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
    }
    .flashcard.correct {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.2);
      animation: hitShake 0.25s ease-in-out;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.6);
    }
    .flashcard.critical {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.3);
      animation: critShake 0.35s ease-in-out;
      box-shadow: 0 0 45px rgba(245, 158, 11, 0.8);
    }
    .flashcard.wrong {
      border-color: #f43f5e;
      background: rgba(244, 63, 94, 0.2);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.6);
    }

    @keyframes hitShake {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.05) rotate(-3deg); }
      75% { transform: scale(1.05) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    @keyframes critShake {
      0% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.1) rotate(-6deg); }
      40% { transform: scale(1.1) rotate(6deg); }
      60% { transform: scale(1.1) rotate(-6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .monster-avatar { font-size: 50px; line-height: 1; margin-bottom: 5px; }
    .word {
      font-size: 60px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      transition: font-size 0.3s ease;
    }

    .status-text {
      font-size: 18px;
      min-height: 28px;
      color: #c084fc;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .crit-popup {
      position: absolute;
      top: -15px;
      font-size: 26px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 10px #f59e0b, 0 0 20px #ef4444;
      animation: floatUp 0.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.8); }
      50% { opacity: 1; transform: translateY(-15px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-30px) scale(1); }
    }

    .btn {
      font-size: 18px;
      font-weight: bold;
      padding: 12px 28px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      margin: 4px;
      transition: transform 0.1s, box-shadow 0.3s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
    .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
    .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
    .btn-danger { background: linear-gradient(135deg, #f43f5e, #be123c); box-shadow: 0 0 20px rgba(244, 63, 94, 0.5); }
    .btn-secondary { background: rgba(255, 255, 255, 0.15); color: #fff; box-shadow: none; font-size: 15px; padding: 8px 18px; }

    /* 📱 iPad 橫屏 (Landscape) 自適應放大優化 */
    @media (orientation: landscape) and (min-width: 768px) {
      body { padding: 10px; }
      .card-container {
        max-width: 820px;
        padding: 28px 36px;
      }
      .flashcard {
        height: 230px;
      }
      .word {
        font-size: 78px;
      }
      .monster-avatar {
        font-size: 58px;
      }
      .monster-name {
        font-size: 20px;
      }
      .status-text {
        font-size: 20px;
      }
      .btn {
        font-size: 20px;
        padding: 14px 36px;
      }
    }

    /* Modal 彈窗樣式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 3, 12, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1e1338;
      border: 2px solid #a855f7;
      border-radius: 28px;
      padding: 26px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
      color: #fff;
    }

    .learn-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed #f59e0b;
      border-radius: 18px;
      padding: 16px;
      margin: 16px 0;
    }
    .learn-word { font-size: 34px; font-weight: bold; color: #f43f5e; }
    .learn-pinyin { font-size: 26px; font-weight: bold; color: #f59e0b; margin-top: 4px; }

    .wrong-words-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 14px;
    }
    .wrong-tag {
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid #f43f5e;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 15px;
      color: #fda4af;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="badges-row">
      <div class="count-badge" id="count-display">⚔️ 擊敗怪物：0 隻</div>
      <div class="combo-badge" id="combo-display">🔥 COMBO x0</div>
      <div class="high-score-badge" id="high-score-display">🏆 最高：0</div>
    </div>

    <div>
      <div class="mode-badge" id="mode-display" onclick="promptNewModeSelect()" title="點擊切換模式">
        ⚙️ 模式：➡️ 順序冒險 (點擊切換)
      </div>
    </div>

    <!-- 👾 怪物血量條舞台 -->
    <div class="monster-stage">
      <div class="monster-name" id="monster-name">Lv.1 錯別字小幽靈</div>
      <div class="monster-hp-bar">
        <div class="monster-hp-fill" id="hp-fill"></div>
      </div>
    </div>

    <div class="flashcard" id="flashcard">
      <div id="crit-box"></div>
      <div class="monster-avatar" id="monster-avatar">👻</div>
      <div class="word" id="word-display">點擊開始討伐</div>
    </div>

    <div class="status-text" id="status-text">點擊按鈕念出魔法咒語打怪</div>

    <button class="btn" id="start-btn" onclick="handleClickStart()">⚔️ 開始討伐怪物</button>
    <br>
    <button class="btn btn-secondary" id="skip-btn" onclick="skipWord()" style="display:none; margin-top:10px;">🛡️ 避開此怪 (跳過)</button>

    <!-- 結算報告 -->
    <div class="result-box" id="result-box" style="display:none; margin-top:20px;">
      <div id="result-title" style="font-size:24px; font-weight:bold; color:#a855f7; margin-bottom:10px;">🎯 勇者討伐戰報</div>
      <div id="result-info" style="font-size:17px; color:#cbd5e0; line-height:1.6;"></div>
    </div>
  </div>

  <!-- 模式選擇 Modal -->
  <div class="modal-overlay" id="mode-select-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #c084fc; margin-bottom: 10px;">🎮 請選擇冒險模式</div>
      <div style="font-size: 15px; color: #a0aec0; margin-bottom: 20px;">你想按照關卡順序打怪，還是挑戰隨機出現的怪物呢？</div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn btn-success" onclick="startNewGame('sequential')">➡️ 順序冒險 (按 1~889 關)</button>
        <button class="btn btn-purple" onclick="startNewGame('random')">🔀 隨機大亂鬥 (全地下城打怪)</button>
      </div>
    </div>
  </div>

  <!-- 讀錯提示 Modal -->
  <div class="modal-overlay" id="fail-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #f43f5e; margin-bottom: 10px;">💥 魔法發動失敗！怪物反擊</div>
      <div class="learn-card">
        <div style="font-size: 14px; color: #a0aec0;">這個詞語魔法的標準吟唱音是：</div>
        <div class="learn-word" id="modal-word">晴朗</div>
        <div class="learn-pinyin" id="modal-pinyin">[ qíng lǎng ]</div>
      </div>
      <div style="font-size: 15px; color: #a0aec0; margin-bottom: 15px;" id="modal-heard"></div>
      
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-success" onclick="choiceContinue()">✨ 重新念咒 (重試此詞)</button>
        <button class="btn btn-warning" onclick="choiceRestart()">🔄 重置地下城 (選擇模式)</button>
        <button class="btn btn-danger" onclick="choiceEnd()">🏁 班師回城 (查看戰報)</button>
      </div>
    </div>
  </div>

  <!-- 存檔 Modal -->
  <div class="modal-overlay" id="save-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #c084fc; margin-bottom: 15px;">📂 發現勇者冒險存檔</div>
      <div style="font-size: 17px; color: #cbd5e0; margin-bottom: 20px;" id="save-modal-text">上次已討伐至第 X 隻怪物，請問要繼續冒險嗎？</div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="btn btn-success" onclick="loadSavedProgress()">繼續上次冒險</button>
        <button class="btn btn-warning" onclick="promptNewModeSelect()">全新冒險</button>
      </div>
    </div>
  </div>

  <script>
    // 💡 全詞庫 282 個繁簡對照表 (確保所有繁簡對應詞語 100% 精準轉換)
    const tradChars = "陰陽雲霧颱風涼濕傾佈時週節國聖誕復萬獨廣廳驗園戲館樂醫鐵車場雜裝歐亞葉邊灘島嶺極腳體網買聽療聰髒齊亂勞歡驚懼飽餓麵條乾淨豬雞龜龍鷹蟻蟲蠅蝦襪褲襯錶鏈纜飛郵辦號線點畫圖書寫讀說話學習語練頭臉雙裏愛問讓開關動進過來產親帶幫對認識變選擇視頻電腦顯紙筆張個隻塊歲幾麼還與輕長遠難溫壞圓灣寬滿興奮氣憤訝尷無緊處區門奧華軍銀綠藍黃懶頑強嚇靜悶劃閃熱後擺隨總結實聯絡續繼斷換轉機碼質數據設備資訊報確證發現獲勝敗頂頸蓋貓鴨馬鳥魚獅鯨烏鯊鵝鱷倉蜴蒼賣掃賽飯夢潛聞題課騎單彈鋼運遊籃欖購淚軟簡骯麗潑壯惡鮮餅腸壽檸薩櫻獼異鉛膠壺貼冊獎顏達傘鐘廁簾錢潔燈調鏡應項鍊環飾紅淺噴飄騰傷羨積覺顆";
    const simpChars = "阴阳云雾台风凉湿倾布时候周节国圣诞复万独广厅验园戏馆乐医铁车场杂装欧亚叶边滩岛岭极脚体网买听疗聪脏齐乱劳欢惊惧饱饿面条干净猪鸡龟龙鹰蚁虫蝇虾袜裤衬表链缆飞邮办号线点画图书写读说话学习语练头脸双里爱问让开关动进过来产亲带帮对认识变选择视频电脑显纸笔张个只块岁几么还与轻长远难温坏圆弯宽满兴奋气愤怒惊讶尴尬无奈紧张处区门奥华军银绿蓝黄懒顽强吓静闷划闪热后摆随总结实联络续继断换转机码质数据设备资讯报确证发现获胜败顶颈盖猫鸭马鸟鱼狮鲸乌鲨鹅鳄仓蜥苍卖扫赛饭梦潜闻题课骑单弹钢运游篮榄购泪软简肮丽泼壮恶鲜饼肠寿柠萨樱猕异铅胶壶贴册奖颜达伞钟厕帘钱洁灯调镜应项链环饰红浅喷飘腾伤羡积觉颗";

    function toSimplified(str) {
      if (!str) return '';
      let result = '';
      for (let char of str) {
        const idx = tradChars.indexOf(char);
        result += idx !== -1 ? simpChars[idx] : char;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getMonsterInfo(index) {
      const icon = monsterIcons[index % monsterIcons.length];
      const title = monsterTitles[index % monsterTitles.length];
      const level = index + 1;
      return { icon, name: `Lv.${level} ${title}` };
    }

    function playSuccessChime(isCrit) {
      try {
        const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const notes = isCrit ? [523.25, 659.25, 783.99, 1046.50, 1318.51] : [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = isCrit ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.04);
          gain.gain.setValueAtTime(0.35, ctx.currentTime + i * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.04 + (isCrit ? 0.35 : 0.22));
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.04);
          osc.stop(ctx.currentTime + i * 0.04 + (isCrit ? 0.35 : 0.22));
        });
      } catch(e) {}
    }

    function playFailBuzz() {
      try {
        const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.35);
      } catch(e) {}
    }

      initSpeechRecognition();

    function stopChallenge() {
      isChallenging = false;
      if (recognition) {
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }
      document.getElementById('start-btn').innerText = '⚔️ 開始討伐怪物';
      document.getElementById('start-btn').className = 'btn';
      document.getElementById('skip-btn').style.display = 'none';
      document.getElementById('status-text').innerText = '勇者已暫停於地下城關卡';
    }

    function initSpeechRecognition() {
      if (!isChallenging) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = false;

      const targetWord = activeWordList[currentIndex].replace(/[…\.]/g, '');
      document.getElementById('status-text').innerText = `🎤 請念出咒語【${targetWord}】攻擊怪物！`;

      recognition.onresult = (event) => {
        if (!isChallenging) return;
        const heardText = event.results[0][0].transcript.trim();
        console.log(`聽到的語音：[${heardText}]，目標詞語：[${targetWord}]`);

        if (checkMatch(heardText, targetWord)) {
          handleSuccess();
        } else {
          handleFailPrompt(targetWord, heardText);
        }
      };

      recognition.onerror = (event) => {
        console.warn("語音辨識提示:", event.error);
        if (event.error === 'no-speech' && isChallenging) {
          restartListening();
        }
      };

      recognition.onend = () => {
        if (isChallenging) {
          restartListening();
        }
      };

      try {
        recognition.start();
      } catch(e) {}
    }

    function restartListening() {
      if (!isChallenging) return;
      try {
        recognition.start();
      } catch(e) {}
    }

    function getStandardPinyin(word) {
      if (window.pinyinPro) {
        try {
          return pinyinPro.pinyin(word, { toneType: 'symbol', type: 'string' });
        } catch(e) {}
      }
      return '';
    }

    function getFuzzyPinyin(str) {
      if (!window.pinyinPro || !str) return '';
      try {
        const py = pinyinPro.pinyin(str, { toneType: 'none', type: 'array' }).join('');
        return py.toLowerCase()
          .replace(/ing/g, 'in')
          .replace(/eng/g, 'en')
          .replace(/ang/g, 'an')
          .replace(/ian/g, 'ian')
          .replace(/zh/g, 'z')
          .replace(/ch/g, 'c')
          .replace(/sh/g, 's')
          .replace(/l/g, 'l')
          .replace(/n/g, 'l')
          .replace(/[^a-z]/g, '');
      } catch(e) {
        return '';
      }
    }

    function levenshteinDistance(a, b) {
      if (!a || !b) return (a || b).length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    // 💡 智能雙向匹配演算法：100% 繁簡完全互通 + 拼音完全相同判定 + Levenshtein 模糊比對
    function checkMatch(heard, target) {
      if (!heard || !target) return false;
      
      // 1. 原字包含比對
      if (heard.includes(target) || target.includes(heard)) return true;

      // 2. 簡體化轉換比對
      const simpHeard = toSimplified(heard);
      const simpTarget = toSimplified(target);
      if (simpHeard.includes(simpTarget) || simpTarget.includes(simpHeard)) return true;

      // 3. 清理非漢字字符比對
      const cleanHeard = simpHeard.replace(/[^\u4e00-\u9fa5]/g, '');
      const cleanTarget = simpTarget.replace(/[^\u4e00-\u9fa5]/g, '');
      if (cleanHeard && cleanTarget && (cleanHeard.includes(cleanTarget) || cleanTarget.includes(cleanHeard))) return true;

      // 4. 拼音 100% 完全相同判定 (例如 哪裏/哪里, 認識/认识, 洗臉/洗脸 等)
      const pyHeard = getFuzzyPinyin(cleanHeard || simpHeard);
      const pyTarget = getFuzzyPinyin(cleanTarget || simpTarget);

      if (pyHeard && pyTarget) {
        if (pyHeard === pyTarget || pyHeard.includes(pyTarget) || pyTarget.includes(pyHeard)) {
          return true; // 拼音完全相同直接放行！
        }

        // 5. 拼音相似度 Levenshtein 門檻 (>= 60%)
        const dist = levenshteinDistance(pyHeard, pyTarget);
        const maxLen = Math.max(pyHeard.length, pyTarget.length);
        const similarity = (maxLen - dist) / maxLen;
        
        console.log(`拼音比對：[${pyHeard}] vs [${pyTarget}]，相似度: ${(similarity * 100).toFixed(1)}%`);

        if (similarity >= 0.60) {
          return true;
        }
      }

      return false;
    }

    function handleSuccess() {
      comboCount++;
      if (comboCount > maxCombo) maxCombo = comboCount;

      const isCrit = comboCount >= 3;

      playSuccessChime(isCrit);
      triggerConfetti(isCrit);

      document.getElementById('hp-fill').style.width = '0%';
      document.getElementById('flashcard').className = isCrit ? 'flashcard critical' : 'flashcard correct';

      if (isCrit) {
        const critBox = document.getElementById('crit-box');
        critBox.innerHTML = `<div class="crit-popup">💥 COMBO x${comboCount} CRITICAL!</div>`;
        document.getElementById('status-text').innerText = `💥 觸發暴擊連擊！發動超強魔法，消滅怪物！`;
      } else {
        document.getElementById('status-text').innerText = `✨ 魔法發動成功！成功消滅怪物！`;
      }

      currentIndex++;
      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }

      setTimeout(() => {
        if (isChallenging) {
          document.getElementById('crit-box').innerHTML = '';
          updateCard();
          initSpeechRecognition();
        }
      }, 180);
    }

    function handleFailPrompt(targetWord, heardText) {
      playFailBuzz();
      comboCount = 0;
      document.getElementById('flashcard').className = 'flashcard wrong';
      
      sessionWrongWords.add(targetWord);

      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }

      document.getElementById('modal-word').innerText = targetWord;
      document.getElementById('modal-pinyin').innerText = `[ ${getStandardPinyin(targetWord)} ]`;
      document.getElementById('modal-heard').innerText = heardText ? `(剛才接收到的咒語是："${heardText}")` : '(未檢測到清晰咒語)';
      document.getElementById('fail-modal').style.display = 'flex';
    }

    function choiceContinue() {
      document.getElementById('fail-modal').style.display = 'none';
      document.getElementById('flashcard').className = 'flashcard';
      initSpeechRecognition();
    }

    function choiceRestart() {
      document.getElementById('fail-modal').style.display = 'none';
      promptNewModeSelect();
    }

    function choiceEnd() {
      document.getElementById('fail-modal').style.display = 'none';
      showFinalSummary();
    }

    function skipWord() {
      if (!isChallenging) return;
      comboCount = 0;
      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }
      currentIndex++;
      updateCard();
      initSpeechRecognition();
    }

    function showFinalSummary() {
      stopChallenge();

      const count = currentIndex;
      const currentMax = loadHighScore();
      let isNewRecord = false;

      if (count > currentMax) {
        localStorage.setItem('vocab_challenge_max', count);
        loadHighScore();
        isNewRecord = true;
      }

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = isNewRecord ? "🎉 恭喜刷新最高討伐紀錄！" : "🎯 勇者地下城討伐報告";
      
      let wrongWordsHTML = "";
      if (sessionWrongWords.size > 0) {
        wrongWordsHTML = `
          <div style="margin-top: 15px; text-align: left;">
            <div style="font-weight: bold; color: #f43f5e; font-size: 16px;">❌ 本次遇到的強敵怪物（複習錯題集）：</div>
            <div class="wrong-words-grid">
              ${Array.from(sessionWrongWords).map(w => `<div class="wrong-tag"><b>${w}</b> <span style="font-size:13px; color:#a0aec0;">(${getStandardPinyin(w)})</span></div>`).join('')}
            </div>
          </div>
        `;
      } else {
        wrongWordsHTML = `<div style="margin-top: 10px; color: #10b981; font-weight: bold;">🌟 太震撼了！本次討伐全程零失誤橫掃！</div>`;
      }

      resultInfo.innerHTML = `
        ⚔️ 本次共成功消滅 <b>${count}</b> 隻怪物！<br>
        🔥 最高連續暴擊：<b>${maxCombo} Combo</b>！<br>
        ${isNewRecord ? "🌟 成功創下新的個人最高討伐紀錄！" : "繼續加油，成為最強詞語大勇者！"}
        ${wrongWordsHTML}
      `;
      resultBox.style.display = 'block';
    }

    function endChallenge(isWin) {
      stopChallenge();
      const count = currentIndex;
      localStorage.setItem('vocab_challenge_max', activeWordList.length);
      loadHighScore();

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = "🎉 恭喜通關整片魔王地下城！";
      resultInfo.innerHTML = `📚 太震撼了！你成功消滅了全部 <b>${count}</b> 隻怪物，成為最強詞語大勇者！`;
      resultBox.style.display = 'block';
    }

    loadHighScore();
    const savedListStr = localStorage.getItem('vocab_saved_list');
    if (savedListStr) {
      try { activeWordList = JSON.parse(savedListStr); } catch(e) {}
    }
    currentMode = localStorage.getItem('vocab_saved_mode') || 'sequential';
    document.getElementById('mode-display').innerText = currentMode === 'random' ? "⚙️ 模式：🔀 隨機大亂鬥 (點擊切換)" : "⚙️ 模式：➡️ 順序冒險 (點擊切換)";
  </script>
</body>
</html>
