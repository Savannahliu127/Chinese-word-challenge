<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ 詞語勇者：打怪物大冒險 (多音字精準修正版)</title>
  <!-- 💡 拼音庫 + 🎉 煙花粒子動畫庫 -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    
    /* 🏰 動態地圖背景 */
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 15px;
      color: #ffffff;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    /* 👹 怪獸造型卡片容器 (Monster-Shaped UI) */
    .card-container {
      background: rgba(26, 16, 51, 0.92);
      border: 3px solid #a855f7;
      backdrop-filter: blur(16px);
      width: 95%;
      max-width: 580px;
      padding: 30px 22px 26px 22px;
      border-radius: 40px 55px 35px 50px / 50px 35px 55px 40px;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
      text-align: center;
      position: relative;
      transition: all 0.3s ease;
    }

    /* 👹 頂部怪獸雙角裝飾 */
    .card-container::before {
      content: '👿';
      position: absolute;
      top: -32px;
      left: 20px;
      font-size: 38px;
      filter: drop-shadow(0 0 8px #a855f7);
      transform: rotate(-20deg);
    }
    .card-container::after {
      content: '👿';
      position: absolute;
      top: -32px;
      right: 20px;
      font-size: 38px;
      filter: drop-shadow(0 0 8px #a855f7);
      transform: rotate(20deg) scaleX(-1);
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }
    .count-badge {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }
    .combo-badge {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #ffffff;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
    .high-score-badge {
      background: #eab308;
      color: #3e2723;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
    }
    .stage-badge {
      background: rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      font-weight: bold;
      padding: 4px 14px;
      border-radius: 14px;
      font-size: 13px;
      margin-bottom: 8px;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .header-ctrls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-badge {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #38bdf8;
      transition: all 0.2s ease;
    }
    .bgm-btn {
      background: rgba(234, 179, 8, 0.2);
      color: #eab308;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #eab308;
      transition: all 0.2s ease;
    }
    .bgm-btn.active {
      background: #eab308;
      color: #1e1338;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.6);
    }

    /* 👾 怪物 stage 與血量條 */
    .monster-stage {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 18px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .monster-name {
      font-size: 18px;
      font-weight: bold;
      color: #f43f5e;
      margin-bottom: 6px;
    }
    .monster-hp-bar {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      height: 16px;
      width: 100%;
      overflow: hidden;
      border: 1px solid #f43f5e;
    }
    .monster-hp-fill {
      background: linear-gradient(90deg, #ef4444, #10b981);
      height: 100%;
      width: 100%;
      transition: width 0.2s ease;
    }
    .boss-hp-fill {
      background: linear-gradient(90deg, #f59e0b, #eab308) !important;
      box-shadow: 0 0 12px #f59e0b;
    }

    .teeth-top {
      font-size: 18px;
      letter-spacing: 6px;
      line-height: 1;
      margin-bottom: -6px;
      user-select: none;
    }
    .flashcard {
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid #a855f7;
      border-radius: 25px 35px 20px 30px / 30px 20px 35px 25px;
      height: 195px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 0 18px 0;
      position: relative;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }
    .flashcard.boss-card {
      border-color: #f59e0b;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.6);
      background: rgba(245, 158, 11, 0.12);
    }
    .flashcard.correct {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.2);
      animation: hitShake 0.25s ease-in-out;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.6);
    }
    .flashcard.critical {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.3);
      animation: critShake 0.35s ease-in-out;
      box-shadow: 0 0 45px rgba(245, 158, 11, 0.8);
    }
    .flashcard.wrong {
      border-color: #f43f5e;
      background: rgba(244, 63, 94, 0.2);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.6);
    }

    @keyframes hitShake {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.05) rotate(-3deg); }
      75% { transform: scale(1.05) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    @keyframes critShake {
      0% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.1) rotate(-6deg); }
      40% { transform: scale(1.1) rotate(6deg); }
      60% { transform: scale(1.1) rotate(-6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .monster-avatar { font-size: 48px; line-height: 1; margin-bottom: 4px; transition: all 0.3s ease; }
    .monster-avatar.boss-avatar { font-size: 66px; filter: drop-shadow(0 0 10px #f59e0b); }

    .word {
      font-size: 58px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      transition: font-size 0.3s ease;
    }

    .status-text {
      font-size: 18px;
      min-height: 28px;
      color: #c084fc;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .crit-popup {
      position: absolute;
      top: -15px;
      font-size: 26px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 10px #f59e0b, 0 0 20px #ef4444;
      animation: floatUp 0.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.8); }
      50% { opacity: 1; transform: translateY(-15px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-30px) scale(1); }
    }

    .btn {
      font-size: 18px;
      font-weight: bold;
      padding: 12px 28px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      margin: 4px;
      transition: transform 0.1s, box-shadow 0.3s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
    .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
    .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
    .btn-danger { background: linear-gradient(135deg, #f43f5e, #be123c); box-shadow: 0 0 20px rgba(244, 63, 94, 0.5); }
    .btn-secondary { background: rgba(255, 255, 255, 0.15); color: #fff; box-shadow: none; font-size: 15px; padding: 8px 18px; }

    /* iPad 橫屏自適應 */
    @media (orientation: landscape) and (min-width: 768px) {
      body { padding: 10px; }
      .card-container { max-width: 820px; padding: 32px 36px; }
      .flashcard { height: 230px; }
      .word { font-size: 78px; }
      .monster-avatar { font-size: 58px; }
      .monster-avatar.boss-avatar { font-size: 78px; }
      .monster-name { font-size: 20px; }
      .status-text { font-size: 20px; }
      .btn { font-size: 20px; padding: 14px 36px; }
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 3, 12, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1e1338;
      border: 2px solid #a855f7;
      border-radius: 28px;
      padding: 26px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
      color: #fff;
    }

    .learn-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed #f59e0b;
      border-radius: 18px;
      padding: 16px;
      margin: 16px 0;
    }
    .learn-word { font-size: 34px; font-weight: bold; color: #f43f5e; }
    .learn-pinyin { font-size: 26px; font-weight: bold; color: #f59e0b; margin-top: 4px; }

    .wrong-words-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 14px;
    }
    .wrong-tag {
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid #f43f5e;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 15px;
      color: #fda4af;
    }
  </style>
</head>
<body>

  <div class="card-container" id="main-card">
    <div class="badges-row">
      <div class="count-badge" id="count-display">⚔️ 擊敗怪物：0 隻</div>
      <div class="combo-badge" id="combo-display">🔥 COMBO x0</div>
      <div class="high-score-badge" id="high-score-display">🏆 最高：0</div>
    </div>

    <div class="stage-badge" id="stage-display">🗺️ 章節 1：🌲 幽靈暗夜森林</div>

    <div class="header-ctrls">
      <div class="mode-badge" id="mode-display" onclick="promptNewModeSelect()" title="點擊切換模式">
        ⚙️ 模式：➡️ 順序冒險
      </div>
      <div class="bgm-btn" id="bgm-btn" onclick="toggleBGM()">
        🎵 BGM: OFF
      </div>
    </div>

    <div class="monster-stage">
      <div class="monster-name" id="monster-name">Lv.1 錯別字小幽靈</div>
      <div class="monster-hp-bar">
        <div class="monster-hp-fill" id="hp-fill"></div>
      </div>
    </div>

    <div class="teeth-top">🔻🔻🔻🔻🔻</div>

    <div class="flashcard" id="flashcard">
      <div id="crit-box"></div>
      <div class="monster-avatar" id="monster-avatar">👻</div>
      <div class="word" id="word-display">點擊開始討伐</div>
    </div>

    <div class="status-text" id="status-text">點擊按鈕念出魔法咒語打怪</div>

    <button class="btn" id="start-btn" onclick="handleClickStart()">⚔️ 開始討伐怪物</button>
    <br>
    <button class="btn btn-secondary" id="skip-btn" onclick="skipWord()" style="display:none; margin-top:10px;">🛡️ 避開此怪 (跳過)</button>

    <div class="result-box" id="result-box" style="display:none; margin-top:20px;">
      <div id="result-title" style="font-size:24px; font-weight:bold; color:#a855f7; margin-bottom:10px;">🎯 勇者討伐戰報</div>
      <div id="result-info" style="font-size:17px; color:#cbd5e0; line-height:1.6;"></div>
    </div>
  </div>

  <div class="modal-overlay" id="mode-select-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #c084fc; margin-bottom: 10px;">🎮 請選擇冒險模式</div>
      <div style="font-size: 15px; color: #a0aec0; margin-bottom: 20px;">你想按照關卡順序打怪，還是挑戰隨機出現的怪物呢？</div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn btn-success" onclick="startNewGame('sequential')">➡️ 順序冒險 (按 1~889 關)</button>
        <button class="btn btn-purple" onclick="startNewGame('random')">🔀 隨機大亂鬥 (全地下城打怪)</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="fail-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #f43f5e; margin-bottom: 10px;">💥 魔法發動失敗！怪物反擊</div>
      <div class="learn-card">
        <div style="font-size: 14px; color: #a0aec0;">這個詞語魔法的標準吟唱音是：</div>
        <div class="learn-word" id="modal-word">晴朗</div>
        <div class="learn-pinyin" id="modal-pinyin">[ qíng lǎng ]</div>
      </div>
      <div style="font-size: 15px; color: #a0aec0; margin-bottom: 15px;" id="modal-heard"></div>
      
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-success" onclick="choiceContinue()">✨ 重新念咒 (重試此詞)</button>
        <button class="btn btn-warning" onclick="choiceRestart()">🔄 重置地下城 (選擇模式)</button>
        <button class="btn btn-danger" onclick="choiceEnd()">🏁 班師回城 (查看戰報)</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="save-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #c084fc; margin-bottom: 15px;">📂 發現勇者冒險存檔</div>
      <div style="font-size: 17px; color: #cbd5e0; margin-bottom: 20px;" id="save-modal-text">上次已討伐至第 X 隻怪物，請問要繼續冒險嗎？</div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="btn btn-success" onclick="loadSavedProgress()">繼續上次冒險</button>
        <button class="btn btn-warning" onclick="promptNewModeSelect()">全新冒險</button>
      </div>
    </div>
  </div>

  <script>

    function toggleBGM() {
      isBgmOn = !isBgmOn;
      const btn = document.getElementById('bgm-btn');
      if (isBgmOn) {
        btn.innerText = "🎵 BGM: ON";
        btn.classList.add('active');
        startBGMLoop();
      } else {
        btn.innerText = "🔇 BGM: OFF";
        btn.classList.remove('active');
        stopBGMLoop();
      }
    }

    function startBGMLoop() {
      if (bgmInterval) clearInterval(bgmInterval);
      const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 523.25, 440.00, 349.23];
      let step = 0;
      bgmInterval = setInterval(() => {
        if (!isBgmOn) return;
        try {
          const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(notes[step % notes.length], ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.22);
          step++;
        } catch(e){}
      }, 300);
    }

    function stopBGMLoop() {
      if (bgmInterval) clearInterval(bgmInterval);
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function loadHighScore() {
      const savedScore = localStorage.getItem('vocab_challenge_max') || 0;
      document.getElementById('high-score-display').innerText = `🏆 最高：${savedScore}`;
      return parseInt(savedScore);
    }

    function saveProgress() {
      localStorage.setItem('vocab_saved_index', currentIndex);
      localStorage.setItem('vocab_saved_mode', currentMode);
      localStorage.setItem('vocab_saved_list', JSON.stringify(activeWordList));
    }

    function updateCard() {
      if (currentIndex >= activeWordList.length) {
        endChallenge(true);
        return;
      }

      const stageIdx = Math.floor(currentIndex / 30) % stageThemes.length;
      const currentTheme = stageThemes[stageIdx];
      document.body.style.background = currentTheme.bg;
      document.getElementById('main-card').style.borderColor = currentTheme.themeColor;
      document.getElementById('stage-display').innerText = `🗺️ 章節 ${stageIdx + 1}：${currentTheme.name}`;

      const monster = getMonsterInfo(currentIndex);
      document.getElementById('monster-name').innerText = monster.name;
      
      const avatarElem = document.getElementById('monster-avatar');
      avatarElem.innerText = monster.icon;

      const hpFill = document.getElementById('hp-fill');
      const flashcard = document.getElementById('flashcard');

      if (monster.isBoss) {
        avatarElem.className = "monster-avatar boss-avatar";
        hpFill.className = "monster-hp-fill boss-hp-fill";
        flashcard.className = "flashcard boss-card";
      } else {
        avatarElem.className = "monster-avatar";
        hpFill.className = "monster-hp-fill";
        flashcard.className = "flashcard";
      }
      hpFill.style.width = '100%';

      document.getElementById('count-display').innerText = `⚔️ 擊敗怪物：${currentIndex} 隻`;
      document.getElementById('combo-display').innerText = `🔥 COMBO x${comboCount}`;
      document.getElementById('mode-display').innerText = currentMode === 'random' ? "⚙️ 模式：🔀 隨機大亂鬥" : "⚙️ 模式：➡️ 順序冒險";
      
      document.getElementById('word-display').innerText = activeWordList[currentIndex];
      saveProgress();
    }

    function handleClickStart() {
      if (isChallenging) {
        stopChallenge();
      } else {
        const savedIdx = parseInt(localStorage.getItem('vocab_saved_index') || '0');
        if (savedIdx > 0 && savedIdx < activeWordList.length) {
          const savedMode = localStorage.getItem('vocab_saved_mode') === 'random' ? '隨機' : '順序';
          document.getElementById('save-modal-text').innerText = `檢測到上次（${savedMode}模式）已討伐至第 ${savedIdx + 1} 隻怪物【${activeWordList[savedIdx] || ''}】，請問要繼續冒險嗎？`;
          document.getElementById('save-modal').style.display = 'flex';
        } else {
          promptNewModeSelect();
        }
      }
    }

    function promptNewModeSelect() {
      if (isChallenging) {
        if (!confirm("切換模式將會暫停當前冒險，確定要切換模式嗎？")) {
          return;
        }
        stopChallenge();

      document.getElementById('save-modal').style.display = 'none';
      document.getElementById('fail-modal').style.display = 'none';
      document.getElementById('mode-select-modal').style.display = 'flex';

    function loadSavedProgress() {
      document.getElementById('save-modal').style.display = 'none';
      currentIndex = parseInt(localStorage.getItem('vocab_saved_index') || '0');
      currentMode = localStorage.getItem('vocab_saved_mode') || 'sequential';
      
      const savedList = localStorage.getItem('vocab_saved_list');
      if (savedList) {
        try { activeWordList = JSON.parse(savedList); } catch(e) { activeWordList = [...rawWordList]; }
      }
      startChallengeProcess();
    }

    function startNewGame(mode) {
      document.getElementById('mode-select-modal').style.display = 'none';
      currentMode = mode;
      if (mode === 'random') {
        activeWordList = shuffleArray(rawWordList);
      } else {
        activeWordList = [...rawWordList];
      }
      currentIndex = 0;
      comboCount = 0;
      maxCombo = 0;
      sessionWrongWords.clear();
      startChallengeProcess();
    }

    function startChallengeProcess() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("您的瀏覽器不支援原生語音辨識，請務必使用 iPad Safari 瀏覽器開啓此網頁！");
        return;
      }

      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();

      if (isBgmOn) startBGMLoop();

      isChallenging = true;
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('start-btn').innerText = '班師回城/暫停';
      document.getElementById('start-btn').className = 'btn btn-danger';
      document.getElementById('skip-btn').style.display = 'inline-block';
      
      updateCard();
      initSpeechRecognition();
    }

    function stopChallenge() {
      isChallenging = false;
      stopBGMLoop();
      if (recognition) {
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }
      document.getElementById('start-btn').innerText = '⚔️ 開始討伐怪物';
      document.getElementById('start-btn').className = 'btn';
      document.getElementById('skip-btn').style.display = 'none';
      document.getElementById('status-text').innerText = '勇者已暫停於地下城關卡';
    }

    function initSpeechRecognition() {
      if (!isChallenging) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = false;

      const targetWord = activeWordList[currentIndex].replace(/[…\.]/g, '');
      const monster = getMonsterInfo(currentIndex);
      document.getElementById('status-text').innerText = monster.isBoss ? `👑 BOSS 戰！請大聲吟唱【${targetWord}】！` : `🎤 請念出咒語【${targetWord}】攻擊怪物！`;

      recognition.onresult = (event) => {
        if (!isChallenging) return;
        const heardText = event.results[0][0].transcript.trim();
        console.log(`聽到的語音：[${heardText}]，目標詞語：[${targetWord}]`);

        if (checkMatch(heardText, targetWord)) {
          handleSuccess();
        } else {
          handleFailPrompt(targetWord, heardText);
        }
      };

      recognition.onerror = (event) => {
        console.warn("語音辨識提示:", event.error);
        if (event.error === 'no-speech' && isChallenging) {
          restartListening();
        }
      };

      recognition.onend = () => {
        if (isChallenging) {
          restartListening();
        }
      };

      try {
        recognition.start();
      } catch(e) {}
    }

    function restartListening() {
      if (!isChallenging) return;
      try {
        recognition.start();
      } catch(e) {}
    }

    // 💡 多音字修正優先提取標準拼音
    function getStandardPinyin(word) {
      if (customPinyinDict[word]) return customPinyinDict[word];
      if (window.pinyinPro) {
        try {
          return pinyinPro.pinyin(word, { toneType: 'symbol', type: 'string' });
        } catch(e) {}
      }
      return '';
    }

    function getFuzzyPinyin(str) {
      if (customFuzzyPinyinDict[str]) return customFuzzyPinyinDict[str];
      if (!window.pinyinPro || !str) return '';
      try {
        const py = pinyinPro.pinyin(str, { toneType: 'none', type: 'array' }).join('');
        return py.toLowerCase()
          .replace(/ing/g, 'in')
          .replace(/eng/g, 'en')
          .replace(/ang/g, 'an')
          .replace(/ian/g, 'ian')
          .replace(/zh/g, 'z')
          .replace(/ch/g, 'c')
          .replace(/sh/g, 's')
          .replace(/l/g, 'l')
          .replace(/n/g, 'l')
          .replace(/[^a-z]/g, '');
      } catch(e) {
        return '';
      }
    }

    function levenshteinDistance(a, b) {
      if (!a || !b) return (a || b).length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    // 💡 拼音優先雙向匹配（包含特例多音字優先校正，100% 消除繁簡字體差異）
    function checkMatch(heard, target) {
      if (!heard || !target) return false;
      
      const cleanHeard = heard.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, '');
      const cleanTarget = target.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, '');

      // 1. 標準拼音完全一致比對
      let pyHeardArray = [];
      let pyTargetArray = [];
      
      if (customFuzzyPinyinDict[cleanTarget]) {
        pyTargetArray = [customFuzzyPinyinDict[cleanTarget]];
      } else {
        try { pyTargetArray = pinyinPro.pinyin(cleanTarget || target, { toneType: 'none', type: 'array' }); } catch(e){}
      }

      if (customFuzzyPinyinDict[cleanHeard]) {
        pyHeardArray = [customFuzzyPinyinDict[cleanHeard]];
      } else {
        try { pyHeardArray = pinyinPro.pinyin(cleanHeard || heard, { toneType: 'none', type: 'array' }); } catch(e){}
      }

      const pyHeardStr = pyHeardArray.join('');
      const pyTargetStr = pyTargetArray.join('');

      if (pyHeardStr && pyTargetStr) {
        if (pyHeardStr === pyTargetStr || pyHeardStr.includes(pyTargetStr) || pyTargetStr.includes(pyHeardStr)) {
          return true;
        }
      }

      // 2. 模糊拼音 Levenshtein 相似度門檻 (>= 60%)
      const fuzzyHeard = getFuzzyPinyin(cleanHeard || heard);
      const fuzzyTarget = getFuzzyPinyin(cleanTarget || target);

      if (fuzzyHeard && fuzzyTarget) {
        if (fuzzyHeard === fuzzyTarget || fuzzyHeard.includes(fuzzyTarget) || fuzzyTarget.includes(fuzzyHeard)) {
          return true;
        }

        const dist = levenshteinDistance(fuzzyHeard, fuzzyTarget);
        const maxLen = Math.max(fuzzyHeard.length, fuzzyTarget.length);
        const similarity = (maxLen - dist) / maxLen;
        
        console.log(`拼音比對：[${fuzzyHeard}] vs [${fuzzyTarget}]，相似度: ${(similarity * 100).toFixed(1)}%`);

        if (similarity >= 0.60) {
          return true;
        }
      }

      return false;
    }

    function handleSuccess() {
      comboCount++;
      if (comboCount > maxCombo) maxCombo = comboCount;

      const monster = getMonsterInfo(currentIndex);
      const isBoss = monster.isBoss;
      const isCrit = comboCount >= 3;

      playSuccessChime(isBoss, isCrit);
      triggerConfetti(isBoss, isCrit);

      document.getElementById('hp-fill').style.width = '0%';
      document.getElementById('flashcard').className = isCrit ? 'flashcard critical' : 'flashcard correct';

      if (isBoss) {
        const critBox = document.getElementById('crit-box');
        critBox.innerHTML = `<div class="crit-popup">👑 BOSS STAGE CLEAR!</div>`;
        document.getElementById('status-text').innerText = `👑 太震撼了！成功擊破 STAGE BOSS 魔王！解鎖全新地圖！`;
      } else if (isCrit) {
        const critBox = document.getElementById('crit-box');
        critBox.innerHTML = `<div class="crit-popup">💥 COMBO x${comboCount} CRITICAL!</div>`;
        document.getElementById('status-text').innerText = `💥 觸發暴擊連擊！發動超強魔法消滅怪物！`;
      } else {
        document.getElementById('status-text').innerText = `✨ 魔法發動成功！成功消滅怪物！`;
      }

      currentIndex++;
      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }

      setTimeout(() => {
        if (isChallenging) {
          document.getElementById('crit-box').innerHTML = '';
          updateCard();
          initSpeechRecognition();
        }
      }, isBoss ? 500 : 180);
    }

    function handleFailPrompt(targetWord, heardText) {
      playFailBuzz();
      comboCount = 0;
      document.getElementById('flashcard').className = 'flashcard wrong';
      
      sessionWrongWords.add(targetWord);

      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }

      document.getElementById('modal-word').innerText = targetWord;
      document.getElementById('modal-pinyin').innerText = `[ ${getStandardPinyin(targetWord)} ]`;
      document.getElementById('modal-heard').innerText = heardText ? `(剛才接收到的咒語是："${heardText}")` : '(未檢測到清晰咒語)';
      document.getElementById('fail-modal').style.display = 'flex';
    }

    function choiceContinue() {
      document.getElementById('fail-modal').style.display = 'none';
      document.getElementById('flashcard').className = 'flashcard';
      initSpeechRecognition();
    }

    function choiceRestart() {
      document.getElementById('fail-modal').style.display = 'none';
      promptNewModeSelect();
    }

    function choiceEnd() {
      document.getElementById('fail-modal').style.display = 'none';
      showFinalSummary();
    }

    function skipWord() {
      if (!isChallenging) return;
      comboCount = 0;
      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }
      currentIndex++;
      updateCard();
      initSpeechRecognition();
    }

    function showFinalSummary() {
      stopChallenge();

      const count = currentIndex;
      const currentMax = loadHighScore();
      let isNewRecord = false;

      if (count > currentMax) {
        localStorage.setItem('vocab_challenge_max', count);
        loadHighScore();
        isNewRecord = true;
      }

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = isNewRecord ? "🎉 恭喜刷新最高討伐紀錄！" : "🎯 勇者地下城討伐報告";
      
      let wrongWordsHTML = "";
      if (sessionWrongWords.size > 0) {
        wrongWordsHTML = `
          <div style="margin-top: 15px; text-align: left;">
            <div style="font-weight: bold; color: #f43f5e; font-size: 16px;">❌ 本次遇到的強敵怪物（複習錯題集）：</div>
            <div class="wrong-words-grid">
              ${Array.from(sessionWrongWords).map(w => `<div class="wrong-tag"><b>${w}</b> <span style="font-size:13px; color:#a0aec0;">(${getStandardPinyin(w)})</span></div>`).join('')}
            </div>
          </div>
        `;
      } else {
        wrongWordsHTML = `<div style="margin-top: 10px; color: #10b981; font-weight: bold;">🌟 太震撼了！本次討伐全程零失誤橫掃！</div>`;
      }

      resultInfo.innerHTML = `
        ⚔️ 本次共成功消滅 <b>${count}</b> 隻怪物！<br>
        👑 解鎖最高地圖：<b>${stageThemes[Math.floor(count / 30) % stageThemes.length].name}</b><br>
        🔥 最高連續暴擊：<b>${maxCombo} Combo</b>！<br>
        ${isNewRecord ? "🌟 成功創下新的個人最高討伐紀錄！" : "繼續加油，成為最強詞語大勇者！"}
        ${wrongWordsHTML}
      `;
      resultBox.style.display = 'block';
    }

    function endChallenge(isWin) {
      stopChallenge();
      const count = currentIndex;
      localStorage.setItem('vocab_challenge_max', activeWordList.length);
      loadHighScore();

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = "🎉 恭喜通關整片魔王地下城！";
      resultInfo.innerHTML = `📚 太震撼了！你成功消滅了全部 <b>${count}</b> 隻怪物，成為最強詞語大勇者！`;
      resultBox.style.display = 'block';
    }

    loadHighScore();
    const savedListStr = localStorage.getItem('vocab_saved_list');
    if (savedListStr) {
      try { activeWordList = JSON.parse(savedListStr); } catch(e) {}
    }
    currentMode = localStorage.getItem('vocab_saved_mode') || 'sequential';
    document.getElementById('mode-display').innerText = currentMode === 'random' ? "⚙️ 模式：🔀 隨機大亂鬥" : "⚙️ 模式：➡️ 順序冒險";
  </script>
</body>
